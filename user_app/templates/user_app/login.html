{% load static%}
<form action="{% url 'login' %}" method="post" id = "loginForm">
    <div id='0'class = "form">        
        <div class = "choose">
            <h1 class= 'register title' >Регістрація</h1>
            <h1 class= 'login title' >Авторізація</h1>
        </div>
        <div class = "formContent" >
            {% csrf_token %}
            {{form.as_p}}
            <button id = "formButton" class = "formButton">Увійти</button>
        </div>
    </div>   
</form>
